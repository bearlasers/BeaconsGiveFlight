name: BeaconsGiveFlight
description: $description
version: '${version}'

main: me.bearlasers.beaconsGiveFlight.BeaconsGiveFlight
api-version: '26.2'
load: POSTWORLD

authors: [ bearlasers ]

commands:
  beaconsgiveflight:
    description: Main command for BeaconsGiveFlight
    permission: beaconsgiveflight.reload
    permission-message: You do not have permission to use this command.
    usage: /<command> reload
permissions:
  beaconsgiveflight.reload:
    description: Allows reloading the BeaconsGiveFlight configuration
    default: op